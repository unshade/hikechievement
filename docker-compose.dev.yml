services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: hike
      POSTGRES_PASSWORD: hike
      POSTGRES_DB: hikechievement
    ports:
      - "5432:5432"
    volumes:
      - pg_hikechievement_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U hike -d hikechievement"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pg_hikechievement_data:
